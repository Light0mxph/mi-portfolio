<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Aztrix Digital Studio</title>
    <meta name="theme-color" content="#07070c">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
    <link rel="stylesheet" href="css/variables.css?v=6">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100svh; text-align: center; gap: 1.4rem; padding: 2rem;
            background: var(--bg-main); color: var(--text-1); font-family: var(--font-sans);
            overflow: hidden; position: relative;
        }
        body::before {
            content: ""; position: fixed; inset: 0; z-index: -1;
            background:
                radial-gradient(ellipse 45% 40% at 50% 30%, rgba(124,58,237,0.22), transparent 70%),
                radial-gradient(rgba(168,85,247,0.06) 1px, transparent 1px);
            background-size: auto, 36px 36px;
        }
        .code { font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.3em; color: var(--accent-soft); text-transform: uppercase; }
        h1 {
            font-family: var(--font-display); font-weight: 700; line-height: 0.9;
            font-size: clamp(6rem, 22vw, 11rem); letter-spacing: -0.04em;
            background: var(--grad-text); -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 40px var(--glow));
        }
        p { color: var(--text-2); max-width: 420px; font-size: 1.05rem; }
        .btn {
            margin-top: 0.6rem; display: inline-flex; align-items: center; gap: 0.5rem;
            background: var(--grad-brand); color: #fff; padding: 0.85rem 1.9rem;
            border-radius: var(--r-sm); font-weight: 600; text-decoration: none;
            box-shadow: 0 10px 30px -10px var(--glow); transition: transform .2s ease, box-shadow .3s ease;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 16px 44px -10px var(--glow); }
    </style>
</head>
<body>
    <span class="code">Error 404 · thread not found</span>
    <h1>404</h1>
    <p>La entidad solicitada no existe o fue movida a otra región del scheduler.</p>
    <a href="/" class="btn">Volver a la base
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </a>
</body>
</html>
