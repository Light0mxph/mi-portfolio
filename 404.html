<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Aztrix Digital Studio</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body { display: flex; align-items: center; justify-content: center; height: 100vh; text-align: center; background: #050507; }
        .error-container { padding: 3rem; border: 1px solid rgba(138, 43, 226, 0.3); border-radius: 12px; background: rgba(18, 18, 24, 0.6); backdrop-filter: blur(10px); }
        h1 { font-size: 6rem; color: #a855f7; font-family: var(--font-display); line-height: 1; margin-bottom: 1rem; text-shadow: 0 0 30px rgba(168, 85, 247, 0.4); }
        p { color: #a0a0b0; margin-bottom: 2rem; font-size: 1.1rem; }
        .btn-return { background: #6d28d9; color: white; padding: 0.8rem 2rem; border-radius: 8px; text-decoration: none; font-weight: 600; display: inline-block; transition: 0.3s; }
        .btn-return:hover { background: #7c3aed; box-shadow: 0 0 20px rgba(124, 58, 237, 0.5); }
    </style>
</head>
<body>
    <div class="error-container">
        <h1>404</h1>
        <p>La entidad solicitada no existe o fue eliminada del servidor.</p>
        <a href="/" class="btn-return">Volver a la base</a>
    </div>
</body>
</html>
